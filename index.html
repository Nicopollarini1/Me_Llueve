<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Me llueve?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1f27">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--t:#14181f;--ok:#1a8f4c;--w:#d68a00;--b:#d23b3b}
@media(prefers-color-scheme:dark){:root{--bg:#101318;--t:#eef1f5}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;padding:14px;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border:0;border-radius:12px;background:#8883;color:var(--t);font:600 17px system-ui;cursor:pointer}
.tabs button.on{background:var(--t);color:var(--bg)}
.card{border-radius:22px;padding:20px;margin-bottom:14px;color:#fff;background:var(--ok)}
.card.warn{background:var(--w)}.card.bad{background:var(--b)}
.when{font-size:15px;opacity:.9;font-weight:600;letter-spacing:.3px}
.big{font-size:64px;line-height:1.1;margin:6px 0 0}
.v{font-size:30px;font-weight:800;line-height:1.15;margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0003;border-radius:999px;padding:7px 13px;font-size:17px;font-weight:700}
.tip{background:#fff3;border-radius:999px;padding:7px 13px;font-size:16px;font-weight:700}
details{margin-top:14px;font-size:15px;line-height:1.6;opacity:.95}
summary{cursor:pointer;font-weight:600}
#msg{text-align:center;opacity:.7;padding:30px}
</style></head><body>
<div class="tabs"><button id="d0" class="on">Hoy</button><button id="d1">Mañana</button></div>
<div id="out"><div id="msg">Cargando…</div></div>
<script>
const LAT=-38.0055, LON=-57.5426;
const P_WARN=25, P_BAD=50, MM_WARN=0.1, MM_BAD=0.5;
const WIND_WARN=20, GUST_WARN=35, GUST_BAD=50;
const TRIPS=[
  {n:"🏢 Ida al trabajo",t:"7:30",h:[7,8],rumbo:337.5},
  {n:"🏋️ Vuelta al gym",t:"16:00",h:[16,17],rumbo:157.5}
];
const C=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const nom=d=>C[Math.round(d/22.5)%16], rad=d=>d*Math.PI/180;
let data=null, day=0;

async function load(){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
  `&hourly=precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,apparent_temperature,cloud_cover,uv_index,visibility,is_day`+
  `&forecast_days=2&wind_speed_unit=kmh&timezone=America%2FArgentina%2FBuenos_Aires`;
  try{ data=(await (await fetch(u)).json()).hourly; render(); }
  catch(e){ document.getElementById("out").innerHTML='<div id="msg">Sin conexión 📡</div>'; }
}

function render(){
  const out=document.getElementById("out"); out.innerHTML="";
  TRIPS.forEach(tr=>{
    const ix=tr.h.map(h=>day*24+h);
    const g=k=>ix.map(i=>data[k][i]);
    const av=k=>g(k).reduce((a,b)=>a+b,0)/ix.length;
    const prob=Math.max(...g("precipitation_probability"));
    const mm=g("precipitation").reduce((a,b)=>a+b,0);
    const gust=Math.max(...g("wind_gusts_10m"));
    const avg=av("wind_speed_10m"), dFrom=g("wind_direction_10m")[0];
    const rel=dFrom-tr.rumbo;
    const head=avg*Math.cos(rad(rel)), side=avg*Math.sin(rad(rel));
    const ap=Math.round(av("apparent_temperature")), temp=Math.round(av("temperature_2m"));
    const nubes=av("cloud_cover"), uv=Math.max(...g("uv_index")), vis=Math.min(...g("visibility"));
    const oscuro=g("is_day").includes(0);

    const rainB=prob>=P_BAD||mm>=MM_BAD, rainW=prob>=P_WARN||mm>=MM_WARN;
    const windB=gust>=GUST_BAD, windW=gust>=GUST_WARN||avg>=WIND_WARN;
    const fog=vis<2000;
    let lvl="ok", big="😎", txt="Salí tranquilo";
    if(nubes>=60){big="☁️";}
    if(rainB&&windB){lvl="bad";big="⛈";txt="Lluvia y viento fuerte";}
    else if(rainB){lvl="bad";big="☔";txt="Te mojás: capa de lluvia";}
    else if(windB){lvl="bad";big="💨";txt="Viento fuerte";}
    else if(rainW){lvl="warn";big="🌦";txt="Puede llover: llevá capa";}
    else if(windW){lvl="warn";big="💨";txt=head>=10?"Viento de frente":"Viento molesto";}
    else if(fog){lvl="warn";big="🌫";txt="Niebla: ojo";}

    const dir=Math.abs(head)<10?"de costado":head>0?"de frente":"de cola";
    const tips=[];
    if(oscuro)tips.push("🔦 Luces");
    if(fog&&txt!="Niebla: ojo")tips.push("🌫 Niebla");
    if(ap<=8)tips.push("🧤 Abrigate");
    if(ap>=30)tips.push("💧 Agua");
    if(uv>=6)tips.push("🧴 Protector");
    const cielo=nubes<25?"☀️ Soleado":nubes<60?"🌤 Parcial":"☁️ Nublado";

    out.insertAdjacentHTML("beforeend",`<div class="card ${lvl}">
      <div class="when">${tr.n} · ${tr.t}</div>
      <div class="big">${big}</div>
      <div class="v">${txt}</div>
      <div class="chips">
        <span class="chip">🌧 ${prob}%</span>
        <span class="chip">💨 ${Math.round(avg)} ${dir}</span>
        <span class="chip">🌡 ${ap}°</span>
        ${tips.map(t=>`<span class="tip">${t}</span>`).join("")}
      </div>
      <details><summary>Ver detalle</summary>
        ${cielo} · UV ${uv.toFixed(0)}<br>
        Lluvia: ${mm.toFixed(1)} mm<br>
        Viento del ${nom(dFrom)} · ráfagas ${Math.round(gust)} km/h<br>
        Temp. ${temp}° (sensación ${ap}°)
        ${Math.abs(side)>=5?`<br>Lateral ${side>0?"derecha":"izquierda"} ${Math.round(Math.abs(side))} km/h`:""}
      </details></div>`);
  });
}
["d0","d1"].forEach((id,i)=>document.getElementById(id).onclick=()=>{
  day=i; d0.classList.toggle("on",i==0); d1.classList.toggle("on",i==1); if(data)render();
});
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
